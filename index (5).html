// ===================== AUDIO (Web Audio API) =====================
let audioCtx = null;
let audioUnlocked = false;

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  audioUnlocked = true;
}

function playTone({ freq = 440, type = 'square', duration = 0.15, volume = 0.25, slideTo = null, delay = 0 }) {
  if (!audioUnlocked || !audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo != null) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + duration);
  }
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function playNoise({ duration = 0.12, volume = 0.2, filterFreq = 800 }) {
  if (!audioUnlocked || !audioCtx) return;
  const t0 = audioCtx.currentTime;
  const bufferSize = Math.floor(audioCtx.sampleRate * duration);
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.5);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = filterFreq;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(volume, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  src.start(t0);
}

const SFX = {
  kill() {
    // Short punchy laser pop
    playTone({ freq: 520, type: 'square', duration: 0.08, volume: 0.18, slideTo: 180 });
    playNoise({ duration: 0.1, volume: 0.12, filterFreq: 1200 });
  },
  leak() {
    // Low warning buzz when enemy reaches the base
    playTone({ freq: 160, type: 'sawtooth', duration: 0.22, volume: 0.22, slideTo: 70 });
    playTone({ freq: 90, type: 'square', duration: 0.28, volume: 0.12, delay: 0.05 });
  },
  place() {
    // Solid mechanical build click + soft confirm
    playTone({ freq: 280, type: 'triangle', duration: 0.07, volume: 0.2 });
    playTone({ freq: 420, type: 'sine', duration: 0.12, volume: 0.15, delay: 0.05 });
  },
  sell() {
    // Soft cash / whoosh down
    playTone({ freq: 380, type: 'sine', duration: 0.1, volume: 0.16, slideTo: 180 });
    playTone({ freq: 220, type: 'triangle', duration: 0.14, volume: 0.1, delay: 0.04 });
  },
  upgrade() {
    // Bright power-up arpeggio
    playTone({ freq: 440, type: 'sine', duration: 0.09, volume: 0.18 });
    playTone({ freq: 554, type: 'sine', duration: 0.09, volume: 0.16, delay: 0.07 });
    playTone({ freq: 659, type: 'sine', duration: 0.14, volume: 0.14, delay: 0.14 });
  }
};

// Unlock audio on first user interaction
function unlockAudioOnce() {
  ensureAudio();
  document.removeEventListener('click', unlockAudioOnce);
  document.removeEventListener('keydown', unlockAudioOnce);
}
document.addEventListener('click', unlockAudioOnce);
document.addEventListener('keydown', unlockAudioOnce);

// ===================== 3D SETUP =====================
const canvas = document.getElementById("game");
const wrap = document.getElementById("canvasWrap");

let W = wrap.clientWidth, H = wrap.clientHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0A0E18);
scene.fog = new THREE.FogExp2(0x0A0E18, 0.018);

const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 200);
camera.position.set(0, 36, 22);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 12;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 2.15;
controls.target.set(0, 0, 0);

dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);

dirLight.shadow.camera.top = 35;
dirLight.shadow.camera.bottom = -35;
dirLight.shadow.bias = -0.0003;
scene.add(dirLight);

function buildSky() {
  // Gradient dome
  const skyGeo = new THREE.SphereGeometry(90, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      topColor: { value: new THREE.Color(0x0B1220) },
      midColor: { value: new THREE.Color(0x121A2E) },
      bottomColor: { value: new THREE.Color(0x1A2438) }
    },
    vertexShader: `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 midColor;
      uniform vec3 bottomColor;
      varying vec3 vWorldPos;
      void main() {
        float h = normalize(vWorldPos).y;
        vec3 col = mix(bottomColor, midColor, smoothstep(-0.2, 0.3, h));
        col = mix(col, topColor, smoothstep(0.3, 0.9, h));
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // Stars
  const starCount = 400;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 70 + Math.random() * 15;
    starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    starPos[i * 3 + 1] = Math.abs(r * Math.cos(phi)) + 5;
    starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
  const stars = new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({ color: 0xAACCFF, size: 0.25, transparent: true, opacity: 0.85, sizeWrite: false })
  );
  scene.add(stars);
  envAnim.push({ type: "stars", mesh: stars });
}

// ========== TERRAIN ==========
function buildTerrain() {
  // Main ground with subtle height variation via vertex colors
  const size = 70;
  const segs = 48;
  const groundGeo = new THREE.PlaneGeometry(size, size, segs, segs);
  const pos = groundGeo.attributes.position;
  const colors = [];
  const c1 = new THREE.Color(0x0E1420);
  const c2 = new THREE.Color(0x151C2A);
  const c3 = new THREE.Color(0x1A2235);

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i); // plane local Y = world Z after rotate
    // Soft hills away from center path corridor
    const dist = Math.hypot(x, y);
    const noise = Math.sin(x * 0.25) * Math.cos(y * 0.2) * 0.35
                + Math.sin(x * 0.5 + y * 0.3) * 0.15;
    // Keep path area flat
    const pathFlat = Math.max(0, 1 - Math.min(1, Math.abs(y) / 14) * Math.min(1, Math.abs(x + 5) / 20));
    const h = noise * (1 - pathFlat * 0.85);
    pos.setZ(i, h);

    const t = (h + 0.5) * 0.5 + dist / 80;
    const col = c1.clone().lerp(c2, Math.min(1, t)).lerp(c3, Math.min(1, dist / 50));
    colors.push(col.r, col.g, col.b);
  }
  groundGeo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  groundGeo.computeVertexNormals();

  const groundMat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.92,
    metalness: 0.08,
    flatShading: false
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Subtle grid overlay (fainter)
  const grid = new THREE.GridHelper(60, 30, 0x1C2436, 0x121820);
  grid.position.y = 0.03;
  grid.material.transparent = true;
  grid.material.opacity = 0.35;
  scene.add(grid);
}

// ========== ENVIRONMENT PROPS ==========
function rand(a, b) { return a + Math.random() * (b - a); }

function isNearPath(x, z, margin = 4) {
  for (let i = 0; i < PATH_POINTS.length - 1; i++) {
    const a = PATH_POINTS[i], b = PATH_POINTS[i + 1];
    const A = x - a.x, B = z - a.z, C = b.x - a.x, D = b.z - a.z;
    const len = C * C + D * D;
    let t = len ? Math.max(0, Math.min(1, (A * C + B * D) / len)) : 0;
    const d = Math.hypot(x - (a.x + t * C), z - (a.z + t * D));
    if (d < margin) return true;
  }
  return false;
}

function buildRocks() {
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x2A3348, roughness: 0.9, metalness: 0.15 });
  const mossMat = new THREE.MeshStandardMaterial({ color: 0x1E3A2F, roughness: 0.95, metalness: 0.05 });
  for (let i = 0; i < 35; i++) {
    let x, z;
    do { x = rand(-28, 28); z = rand(-28, 28); } while (isNearPath(x, z, 4.5));
    const g = new THREE.Group();
    const s = rand(0.4, 1.4);
    const rock = new THREE.Mesh(
      new THREE.DodecahedronGeometry(s, 0),
      Math.random() > 0.7 ? mossMat : rockMat
    );
    rock.scale.set(rand(0.8, 1.4), rand(0.5, 1.1), rand(0.8, 1.3));
    rock.rotation.set(rand(0, 1), rand(0, 6), rand(0, 1));
    rock.castShadow = true;
    rock.receiveShadow = true;
    g.add(rock);
    g.position.set(x, s * 0.25, z);
    scene.add(g);
  }
}

function buildCrystals() {
  const colors = [0x00D4FF, 0xC77DFF, 0x2EE59D, 0xFF6BCB];
  for (let i = 0; i < 18; i++) {
    let x, z;
    do { x = rand(-26, 26); z = rand(-26, 26); } while (isNearPath(x, z, 5));
    const col = colors[i % colors.length];
    const mat = new THREE.MeshStandardMaterial({
      color: col, metalness: 0.6, roughness: 0.25,
      emissive: col, emissiveIntensity: 0.4, transparent: true, opacity: 0.9
    });
    const g = new THREE.Group();
    const h = rand(0.8, 2.2);
    const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(rand(0.25, 0.5), 0), mat);
    crystal.scale.set(1, h, 1);
    crystal.position.y = h * 0.4;
    crystal.rotation.y = rand(0, 6);
    crystal.castShadow = true;
    g.add(crystal);
    // Smaller companion crystals
    for (let j = 0; j < 2; j++) {
      const c2 = new THREE.Mesh(new THREE.OctahedronGeometry(rand(0.12, 0.22), 0), mat);
      c2.scale.set(1, rand(0.6, 1.2), 1);
      c2.position.set(rand(-0.4, 0.4), rand(0.2, 0.5), rand(-0.4, 0.4));
      g.add(c2);
    }
    g.position.set(x, 0, z);
    scene.add(g);
    // Point light near larger crystals
    if (h > 1.4) {
      const pl = new THREE.PointLight(col, 0.35, 8, 2);
      pl.position.set(x, h * 0.6, z);
      scene.add(pl);
      envAnim.push({ type: "crystalLight", light: pl, base: 0.35, phase: rand(0, 10) });
    }
    envAnim.push({ type: "crystal", mesh: g, phase: rand(0, 10), speed: rand(0.4, 1.0) });
  }
}

function buildRuins() {

  spots.forEach(([x, z], idx) => {
    const g = new THREE.Group();
    // Broken wall pieces
    for (let i = 0; i < 3; i++) {
      const h = rand(1.2, 3.5);
      const wall = new THREE.Mesh(new THREE.BoxGeometry(rand(0.4, 1.2), h, rand(0.3, 0.6)), mat);
      wall.position.set(rand(-1.5, 1.5), h / 2, rand(-1, 1));
      wall.rotation.y = rand(-0.3, 0.3);

}

function buildTrees() {
  // Stylized sci-fi / alien trees
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2A2030, roughness: 0.9 });
  const leafColors = [0x1A4A3A, 0x2A3A5A, 0x3A2A4A, 0x1A3A4A];
  for (let i = 0; i < 22; i++) {
    let x, z;
    do { x = rand(-30, 30); z = rand(-30, 30); } while (isNearPath(x, z, 5.5) || Math.hypot(x, z) < 8);
    const g = new THREE.Group();
    const th = rand(1.5, 3.5);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.22, th, 6), trunkMat);
    trunk.position.y = th / 2;
    trunk.castShadow = true;
    g.add(trunk);
    const leafMat = new THREE.MeshStandardMaterial({

      canopy.scale.set(1, rand(0.7, 1.2), 1);

      g.add(canopy);

    envAnim.push({ type: "tree", mesh: g, phase: rand(0, 10), speed: rand(0.3, 0.7) });

function updateEnvironment(now, dt) {
  const t = now * 0.001;
  for (const obj of envAnim) {
    if (obj.type === "crystal") {
      obj.mesh.rotation.y = t * obj.speed * 0.3 + obj.phase;
      obj.mesh.position.y = Math.sin(t * obj.speed + obj.phase) * 0.08;
    } else if (obj.type === "crystalLight") {
      obj.light.intensity = obj.base * (0.7 + 0.3 * Math.sin(t * 2 + obj.phase));
    } else if (obj.type === "beacon") {
      const pulse = 0.7 + 0.3 * Math.sin(t * 2.5 + obj.phase);
      obj.light.intensity = obj.base * pulse;
      if (obj.lamp) obj.lamp.material.emissiveIntensity = 0.5 + 0.4 * pulse;
    } else if (obj.type === "portal") {
      obj.ring.rotation.z = t * 0.8 + obj.phase;
      obj.gate.material.opacity = 0.55 + 0.25 * Math.sin(t * 3 + obj.phase);
      obj.gate.material.emissiveIntensity = 0.4 + 0.3 * Math.sin(t * 2.5 + obj.phase);
    } else if (obj.type === "debris") {
      obj.mesh.position.y = obj.baseY + Math.sin(t * obj.speed + obj.phase) * 0.4;
      obj.mesh.rotation.x += obj.rotSpeed * dt * 0.5;
      obj.mesh.rotation.z += obj.rotSpeed * dt * 0.3;
    } else if (obj.type === "tree") {
      obj.mesh.rotation.z = Math.sin(t * obj.speed + obj.phase) * 0.03;
    } else if (obj.type === "dust") {
      const p = obj.pos;
      for (let i = 0; i < p.length; i += 3) {
        p[i + 1] += dt * 0.3;
        if (p[i + 1] > 12) p[i + 1] = 0.3;
        p[i] += Math.sin(t + i) * dt * 0.15;
      }
      obj.mesh.geometry.attributes.position.needsUpdate = true;
    } else if (obj.type === "stars") {
      obj.mesh.rotation.y = t * 0.01;
    }
  }
}

// ===================== PATH =====================
const PATH_POINTS = [
  new THREE.Vector3(-22, 0, 0),
  new THREE.Vector3(-10, 0, 0),
  new THREE.Vector3(-10, 0, -8),
  new THREE.Vector3(2, 0, -8),
  new THREE.Vector3(2, 0, 8),
  new THREE.Vector3(12, 0, 8),
  new THREE.Vector3(12, 0, -4),
  new THREE.Vector3(20, 0, -4),
  new THREE.Vector3(24, 0, -4)
];

const PATH_WIDTH = 3.2;

function buildPathMesh() {
  // Flat 2D-style road — thin plane segments on the ground so 3D enemies sit clearly on top
  const roadMat = new THREE.MeshStandardMaterial({
    color: 0x2A3548,
    roughness: 0.85,
    metalness: 0.15,
    side: THREE.DoubleSide
  });
  const edgeMat = new THREE.MeshStandardMaterial({
    color: 0x3A4A60,
    roughness: 0.8,
    metalness: 0.2
  });
  const centerMat = new THREE.MeshBasicMaterial({
    color: 0x4A5A70,
    transparent: true,
    opacity: 0.7
  });

  for (let i = 0; i < PATH_POINTS.length - 1; i++) {
    const a = PATH_POINTS[i];
    const b = PATH_POINTS[i + 1];
    const dx = b.x - a.x;
    const dz = b.z - a.z;
    const len = Math.hypot(dx, dz);
    const angle = Math.atan2(dx, dz);

    // Main flat road segment
    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(PATH_WIDTH, len + 0.15),
      roadMat
    );
    road.rotation.x = -Math.PI / 2;
    road.rotation.z = -angle;
    road.position.set((a.x + b.x) / 2, 0.02, (a.z + b.z) / 2);
    road.receiveShadow = true;
    scene.add(road);

    // Left edge stripe
    const leftEdge = new THREE.Mesh(
      new THREE.PlaneGeometry(0.18, len + 0.15),
      edgeMat
    );
    leftEdge.rotation.x = -Math.PI / 2;
    leftEdge.rotation.z = -angle;
    const lx = Math.cos(angle) * (PATH_WIDTH / 2 - 0.1);
    const lz = -Math.sin(angle) * (PATH_WIDTH / 2 - 0.1);
    leftEdge.position.set((a.x + b.x) / 2 + lx, 0.03, (a.z + b.z) / 2 + lz);
    scene.add(leftEdge);

    // Right edge stripe
    const rightEdge = new THREE.Mesh(
      new THREE.PlaneGeometry(0.18, len + 0.15),
      edgeMat
    );
    rightEdge.rotation.x = -Math.PI / 2;
    rightEdge.rotation.z = -angle;
    rightEdge.position.set((a.x + b.x) / 2 - lx, 0.03, (a.z + b.z) / 2 - lz);
    scene.add(rightEdge);

    // Center dashed line
    const dashes = Math.max(1, Math.floor(len / 1.8));
    for (let d = 0; d < dashes; d++) {
      const t = (d + 0.5) / dashes;
      const cx = a.x + dx * t;
      const cz = a.z + dz * t;
      const dash = new THREE.Mesh(
        new THREE.PlaneGeometry(0.12, 0.7),
        centerMat
      );
      dash.rotation.x = -Math.PI / 2;
      dash.rotation.z = -angle;
      dash.position.set(cx, 0.04, cz);
      scene.add(dash);
    }

    // Direction arrow on the flat path
    const mid = a.clone().lerp(b, 0.5);
    const dir = new THREE.Vector3(dx, 0, dz).normalize();
    const arrowShape = new THREE.Shape();
    arrowShape.moveTo(0, 0.55);
    arrowShape.lineTo(-0.35, -0.35);
    arrowShape.lineTo(0.35, -0.35);
    arrowShape.closePath();
    const arrowGeo = new THREE.ShapeGeometry(arrowShape);
    const arrowMat = new THREE.MeshBasicMaterial({ color: 0x5A6A80, side: THREE.DoubleSide });
    const arrow = new THREE.Mesh(arrowGeo, arrowMat);
    arrow.rotation.x = -Math.PI / 2;
    arrow.rotation.z = -angle;
    arrow.position.set(mid.x, 0.05, mid.z);
    scene.add(arrow);
  }

  // Rounded joints at corners so the path looks continuous
  for (let i = 1; i < PATH_POINTS.length - 1; i++) {
    const joint = new THREE.Mesh(
      new THREE.CircleGeometry(PATH_WIDTH / 2, 16),
      roadMat
    );
    joint.rotation.x = -Math.PI / 2;
    joint.position.set(PATH_POINTS[i].x, 0.015, PATH_POINTS[i].z);
    joint.receiveShadow = true;
    scene.add(joint);
  }
}

function makeMat(color, metal = 0.4, rough = 0.35) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color),
    metalness: metal,
    roughness: rough,
    emissive: new THREE.Color(color),
    emissiveIntensity: 0.15
  });
}

function makeDarkMat() {
  return new THREE.MeshStandardMaterial({ color: 0x1C2436, metalness: 0.3, roughness: 0.6 });
}

function createRailgunnerMesh(level) {
  const group = new THREE.Group();
  const cyan = makeMat("#00D4FF", 0.6, 0.25);
  const dark = makeDarkMat();
  const accent = makeMat("#80E8FF", 0.7, 0.2);

  // Base platform
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.25, 1.2), dark);
  base.position.y = 0.12;
  base.castShadow = true;
  group.add(base);

  // Legs
  [[-0.55, -0.4], [0.55, -0.4]].forEach(([x, z]) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.4), dark);
    leg.position.set(x, 0.1, z);
    group.add(leg);
  });

  // Body stack (levels add more layers like PPT)
  const layers = Math.min(level + 1, 5);
  for (let i = 0; i < layers; i++) {
    const w = 1.0 - i * 0.08;
    const h = 0.28;
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.7), cyan);
    body.position.y = 0.35 + i * 0.3;
    body.castShadow = true;
    group.add(body);
  }

  // Barrel — points along local +Z so it matches tower.mesh.rotation.y = atan2(dx, dz)
  const barrelLen = 1.4 + level * 0.15;
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, barrelLen, 8), accent);
  barrel.rotation.x = Math.PI / 2; // Y-axis cylinder → along +Z
  barrel.position.set(0, 0.55 + layers * 0.12, 0.7 + barrelLen * 0.3);
  barrel.castShadow = true;
  group.add(barrel);

  // Barrel tip glow
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), makeMat("#80E8FF", 0.8, 0.1));
  tip.position.set(0, 0.55 + layers * 0.12, 0.7 + barrelLen * 0.55);
  group.add(tip);


  // Top sensor
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 0.15, 8), dark);
  top.position.y = 0.35 + layers * 0.3 + 0.1;
  group.add(top);

  // Level 4+ extra coils
  if (level >= 3) {
    const coil = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.06, 8, 16), accent);
    coil.rotation.x = Math.PI / 2;
    coil.position.y = 0.7;
    group.add(coil);
  }
  if (level >= 4) {
    const coil2 = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.05, 8, 16), cyan);
    coil2.rotation.x = Math.PI / 2;
    coil2.position.y = 1.0;
    group.add(coil2);
  }

  return group;
}

function createArcaneMesh(level) {

  spire.position.y = 0.6 + spireH / 2;

  // Top crystal
  const top = new THREE.Mesh(new THREE.OctahedronGeometry(0.28, 0), glow);
  top.position.y = 0.6 + spireH + 0.15;
  group.add(top);

  // Orbiting rings (more with levels, matching PPT)
  const ringCount = Math.min(level + 1, 4);
  for (let i = 0; i < ringCount; i++) {
    const r = 0.55 + i * 0.12;
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(r, 0.04, 6, 24),
      i % 2 === 0 ? glow : purple
    );
    ring.rotation.x = Math.PI / 2 + (i * 0.15);
    ring.position.y = 0.9 + i * 0.25;
    ring.userData.isRing = true;
    ring.userData.spinSpeed = 0.8 + i * 0.3;
    group.add(ring);
  }

  // Level 4+ floating orbs
  if (level >= 3) {
    for (let i = 0; i < 2 + (level - 3); i++) {
      const orb = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), glow);
      const ang = (i / (2 + level - 3)) * Math.PI * 2;
      orb.position.set(Math.cos(ang) * 0.7, 1.0, Math.sin(ang) * 0.7);
      orb.userData.isOrb = true;

}

function createTowerMesh(type, level) {
  switch (type) {
    case "Railgunner": return createRailgunnerMesh(level);
    case "Operator": return createOperatorMesh(level);
    case "Treasury": return createTreasuryMesh(level);
    case "Vigilante": return createVigilanteMesh(level);
    case "Arcane": return createArcaneMesh(level);
    case "LePookie": return createLePookieMesh(level);
    case "ElBazooka": return createElBazookaMesh(level);
    default: return new THREE.Group();
  }
}

// ===================== TOWER UI =====================
function buildTowerList() {
  const list = document.getElementById("towerList");
  list.innerHTML = "";
  Object.keys(TOWERS).forEach(key => {
    const t = TOWERS[key];
    const btn = document.createElement("div");
    btn.className = "tower-btn";
    btn.dataset.type = key;
    btn.innerHTML = `
      <div class="tower-icon" style="background:${t.color}22;color:${t.color}">${t.icon}</div>
      <div class="tower-info">
        <div class="tower-name">${t.name}</div>
        <div class="tower-cost">$${t.baseCost}</div>
        <div class="tower-desc">${t.levels[0].special}</div>
      </div>
    `;
    btn.onclick = () => {
      if (state.money < t.baseCost) return showMsg("Not enough money");
      state.placing = key;
      state.selected = null;
      document.querySelectorAll(".tower-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      document.getElementById("selectedInfo").style.display = "none";
      clearRangeIndicator();
      createPlacementGhost(key);
    };
    list.appendChild(btn);
  });
}

function showSelected(tower) {
  const info = document.getElementById("selectedInfo");
  info.style.display = "block";
  const conf = TOWERS[tower.type];
  const lvl = conf.levels[tower.level];
  document.getElementById("selName").textContent = conf.name;
  document.getElementById("selLevel").textContent = tower.level + 1;
  document.getElementById("selDmg").textContent = lvl.dmg || "—";
  document.getElementById("selRange").textContent = lvl.range || "—";
  document.getElementById("selRate").textContent = lvl.rate ? lvl.rate + "/s" : "—";
  document.getElementById("selSpecial").textContent = lvl.special;
  
  const next = conf.levels[tower.level + 1];
  const upBtn = document.getElementById("upgradeBtn");
  if (next) {
    upBtn.disabled = state.money < next.cost;
    upBtn.textContent = `Upgrade ($${next.cost})`;
  } else {
    upBtn.disabled = true;
    upBtn.textContent = "Max Level";
  }

  showRangeIndicator(tower);
}

function createPlacementGhost(type) {
  clearPlacementGhost();
  const mesh = createTowerMesh(type, 0);
  mesh.traverse(c => {
    if (c.isMesh) {
      c.material = c.material.clone();
      c.material.transparent = true;
      c.material.opacity = 0.55;
      c.material.depthWrite = false;
    }
  });
  mesh.visible = false;
  scene.add(mesh);
  state.placementGhost = mesh;

  // Range ring
  const conf = TOWERS[type];
  const range = conf.levels[0].range / 10; // scale to 3D units
  if (range > 0) {
    const ringGeo = new THREE.RingGeometry(range - 0.15, range, 48);
    const ringMat = new THREE.MeshBasicMaterial({
      color: conf.color,
      transparent: true,
      opacity: 0.35,
      side: THREE.DoubleSide
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.05;
    mesh.add(ring);
  }
}

function clearPlacementGhost() {
  if (state.placementGhost) {
    scene.remove(state.placementGhost);
    state.placementGhost = null;
  }
}

function showRangeIndicator(tower) {
  clearRangeIndicator();
  const conf = TOWERS[tower.type];
  const range = conf.levels[tower.level].range / 10;
  if (!range) return;

  const ringGeo = new THREE.RingGeometry(range - 0.12, range, 64);
  const ringMat = new THREE.MeshBasicMaterial({
    color: conf.color,
    transparent: true,
    opacity: 0.3,
    side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(tower.x, 0.06, tower.z);
  scene.add(ring);
  state.rangeIndicator = ring;
}

function clearRangeIndicator() {
  if (state.rangeIndicator) {
    scene.remove(state.rangeIndicator);
    state.rangeIndicator = null;
  }
}

// ===================== ENTITIES =====================
function createTower(type, x, z) {
  const mesh = createTowerMesh(type, 0);
  mesh.position.set(x, 0, z);
  scene.add(mesh);
  return {
    type, x, z,
    level: 0,
    lastShot: 0,
    shotCount: 0,
    mesh
  };
}

function createEnemy(type) {
  const conf = ENEMIES[type];
  const hpMult = 1 + (state.wave - 1) * 0.1;
  const scaledHp = Math.floor(conf.hp * hpMult);
  const scaledShield = conf.shield ? Math.floor(conf.shield * hpMult) : 0;

  const mesh = createEnemyMesh(type, conf);
  const start = PATH_POINTS[0];
  const startY = conf.flying ? 2.0 : conf.radius + 0.15;
  mesh.position.set(start.x, startY, start.z);
  scene.add(mesh);

  return {
    type,
    x: start.x,
    z: start.z,
    y: startY,
    hp: scaledHp,
    maxHp: scaledHp,
    speed: conf.speed,
    armor: conf.armor,
    reward: conf.reward,
    radius: conf.radius,
    color: conf.color,
    pathIndex: 0,
    shield: scaledShield,
    maxShield: scaledShield,
    slow: 0,
    marked: 0,
    flying: conf.flying || false,
    heal: conf.heal || false,
    explode: conf.explode || false,
    boss: conf.boss || false,
    spawnedShields: false,
    alive: true,
    mesh
  };
}

// ===================== COMBAT =====================
/** Sum LePookie aura buffs affecting a tower. Returns { dmgMul, rangeMul, rateMul }. */
function getLePookieBuffs(tower) {
  let dmgMul = 1, rangeMul = 1, rateMul = 1;
  const confP = TOWERS.LePookie;
  if (!confP) return { dmgMul, rangeMul, rateMul };

  for (const p of state.towers) {
    if (p.type !== "LePookie" || p === tower) continue;
    const auraRange = confP.levels[p.level].range / 10;
    if (dist2D(tower, p) > auraRange) continue;
    const scale = 1 + 0.2 * p.level; // every level: buffs go up by 20%
    dmgMul += confP.buffDmg * scale;
    rangeMul += confP.buffRange * scale;
    rateMul += confP.buffDps * scale; // DPS buff applied as fire-rate multiplier
  }
  return { dmgMul, rangeMul, rateMul };
}

function findTarget(tower) {
  const conf = TOWERS[tower.type];
  const buffs = getLePookieBuffs(tower);
  const range = (conf.levels[tower.level].range / 10) * buffs.rangeMul;
  let best = null;
  let bestDist = range;

  for (const e of state.enemies) {
    if (!e.alive) continue;
    const d = dist2D(tower, e);
    if (d < bestDist) {
      bestDist = d;
      best = e;
    }
  }
  return best;
}

function applyDamageToEnemy(e, rawDmg, armorPen = 1) {
  let dmg = rawDmg * (1 - e.armor * armorPen);
  if (e.shield > 0) {
    e.shield -= dmg;
    if (e.shield < 0) {
      e.hp += e.shield;
      e.shield = 0;
    }
  } else {
    e.hp -= dmg;
  }
  updateEnemyHpBar(e);
  if (e.hp <= 0) killEnemy(e);
}

function shoot(tower, target, now) {
  const conf = TOWERS[tower.type];
  const lvl = conf.levels[tower.level];
  if (!lvl.dmg) return;

  tower.lastShot = now;
  tower.shotCount++;

  // Face target
  const dx = target.x - tower.x;
  const dz = target.z - tower.z;
  tower.mesh.rotation.y = Math.atan2(dx, dz);

  const buffs = getLePookieBuffs(tower);
  let dmg = lvl.dmg * buffs.dmgMul;

  if (tower.type === "Railgunner" && tower.level >= 2 && Math.random() < 0.15) {
    dmg *= 2.5;
  }
  if (tower.type === "Railgunner" && tower.level >= 3 && tower.shotCount % 4 === 0) {
    dmg *= 1.6;
  }

  if (target.marked > now) dmg *= 1.2;

  // El Bazooka: big projectile + AOE splash at impact
  if (tower.type === "ElBazooka") {
    const splashR = (conf.splash && conf.splash[tower.level]) || 5;
    // Primary + all enemies in splash radius (including primary once)
    for (const e of state.enemies) {
      if (!e.alive) continue;
      if (dist2D(target, e) <= splashR) {
        applyDamageToEnemy(e, dmg, 1);
      }
    }
    // Fat orange rocket projectile
    createProjectile(tower.x, 1.5, tower.z, target.x, target.y + 0.4, target.z, conf.color, 18);
    // Explosion particles at impact
    for (let i = 0; i < 14; i++) {
      const geo = new THREE.SphereGeometry(0.15 + Math.random() * 0.1, 4, 4);
      const mat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(Math.random() > 0.5 ? "#FF6B00" : "#FFEE58")
      });
      const p = new THREE.Mesh(geo, mat);
      p.position.set(target.x, target.y + 0.5, target.z);
      scene.add(p);
      state.particles.push({
        mesh: p,
        vx: (Math.random() - 0.5) * 0.5,
        vy: Math.random() * 0.35,
        vz: (Math.random() - 0.5) * 0.5,
        life: 30
      });
    }
    return;
  }

  applyDamageToEnemy(target, dmg, tower.type === "Railgunner" ? 0.5 : 1);

  if (tower.type === "Operator") {
    target.marked = now + 3000;
  }
  if (tower.type === "Vigilante" && tower.level >= 1) {
    target.hp -= 4;
    updateEnemyHpBar(target);
    if (target.hp <= 0) killEnemy(target);
  }
  if (tower.type === "Arcane") {
    const chainCount = Math.min(tower.level + 1, 4);
    let last = target;
    let chainDmg = dmg * 0.6;
    for (let i = 0; i < chainCount; i++) {
      let next = null;
      let nd = 8;
      for (const e of state.enemies) {
        if (!e.alive || e === last) continue;
        const d = dist2D(last, e);
        if (d < nd) { nd = d; next = e; }
      }
      if (!next) break;
      next.hp -= chainDmg;
      next.slow = now + 2000;
      chainDmg *= 0.7;
      createProjectile(last.x, last.y + 0.5, last.z, next.x, next.y + 0.5, next.z, conf.color, 8);
      last = next;
      updateEnemyHpBar(next);
      if (next.hp <= 0) killEnemy(next);
    }
  }
  if (tower.type === "Railgunner" && tower.level >= 4 && Math.random() < 0.25) {
    target.slow = now + 800;
  }

  // Main projectile
  createProjectile(tower.x, 1.2, tower.z, target.x, target.y + 0.4, target.z, conf.color, 12);
}


function createProjectile(x1, y1, z1, x2, y2, z2, color, life) {
  const geo = new THREE.SphereGeometry(0.12, 6, 6);
  const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(color) });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x1, y1, z1);
  scene.add(mesh);
  state.projectiles.push({
    mesh,
    tx: x2, ty: y2, tz: z2,
    life
  });
}

function killEnemy(e) {
  if (!e.alive) return;
  e.alive = false;
  state.money += e.reward;
  SFX.kill();

  // Death particles
  for (let i = 0; i < 8; i++) {
    const geo = new THREE.SphereGeometry(0.1, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(e.color) });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(e.mesh.position);
    scene.add(p);
    state.particles.push({
      mesh: p,
      vx: (Math.random() - 0.5) * 0.3,
      vy: Math.random() * 0.25,
      vz: (Math.random() - 0.5) * 0.3,
      life: 25
    });
  }

  if (e.explode) {
    for (const t of state.towers) {
      if (dist2D(t, e) < 6) {
        // visual only
      }
    }
  }

  scene.remove(e.mesh);
  updateUI();
}


function updateEnemyHpBar(e) {
  if (!e.mesh) return;
  const bar = e.mesh.getObjectByName("hpBar");
  if (!bar) return;
  // Include shield so the bar depletes when shield absorbs damage too
  const totalMax = e.maxHp + (e.maxShield || 0);
  const totalNow = Math.max(0, e.hp) + Math.max(0, e.shield || 0);
  const pct = Math.max(0, Math.min(1, totalNow / totalMax));
  bar.scale.x = Math.max(0.001, pct);
  // Keep left-aligned as it shrinks
  bar.position.x = -e.radius * 1.1 * (1 - pct);
  // Color: green → yellow → red (matches modern TDS / PPT accent palette)
  if (pct > 0.6) bar.material.color.set(0x2EE59D);
  else if (pct > 0.3) bar.material.color.set(0xFFC107);
  else bar.material.color.set(0xFF4D6A);
}

// ===================== WAVE =====================
function startWave() {
  if (state.waveActive || state.gameOver) return;
  if (state.wave >= WAVES.length) {
    showMsg("All waves complete! You win!");
    showRestartButton(true);
    return;
  }

  state.waveActive = true;
  state.wave++;
  const waveData = WAVES[state.wave - 1];
  state.spawnQueue = [];

  waveData.forEach(group => {
    for (let i = 0; i < group.count; i++) {
      state.spawnQueue.push({ type: group.type, delay: group.gap * i * 1000 });
    }
  });
  state.spawnQueue.sort((a, b) => a.delay - b.delay);
  state.waveStart = performance.now();
  state.lastSpawnIndex = 0;

  document.getElementById("startWave").textContent = "Wave in progress...";
  document.getElementById("startWave").disabled = true;
  document.getElementById("skipWave").style.display = "block";
  updateUI();
  showMsg(`Wave ${state.wave} started!`);
}

function skipWave() {
  if (!state.waveActive || state.gameOver) return;
  state.spawnQueue = [];
  state.lastSpawnIndex = 9999;
  document.getElementById("skipWave").style.display = "none";
  document.getElementById("startWave").textContent = "Clear remaining...";
  showMsg("Wave skipped! Clear the remaining enemies");
}

function showRestartButton(show) {
  const btn = document.getElementById("restartBtn");
  if (show) btn.classList.add("show");
  else btn.classList.remove("show");
}

function endWave() {
  state.waveActive = false;
  const won = state.wave >= WAVES.length;
  document.getElementById("startWave").textContent = won ? "Victory!" : "Start Wave";
  document.getElementById("startWave").disabled = won;
  document.getElementById("skipWave").style.display = "none";
  if (won) {
    showMsg("All waves complete! You win!", 4000);
    showRestartButton(true);
  }

  // Base wave bonus scales with wave number: wave 1 = $50, wave 2 = $100, etc.
  let income = 50 * state.wave;
  state.towers.forEach(t => {
    if (t.type === "Treasury") {
      income += TOWERS.Treasury.income[t.level];
    }
  });
  state.money += income;
  const baseBonus = 50 * state.wave;
  showMsg(`+$${income} (wave ${state.wave} bonus $${baseBonus}${income > baseBonus ? " + Treasury" : ""})`);

  updateUI();
}

// ===================== UPDATE =====================
function update(dt, now) {
  if (state.gameOver) return;

  // Spawn
  if (state.waveActive && state.lastSpawnIndex < state.spawnQueue.length) {
    const next = state.spawnQueue[state.lastSpawnIndex];
    if (now - state.waveStart >= next.delay) {
      state.enemies.push(createEnemy(next.type));
      state.lastSpawnIndex++;
    }
  }

  // Wave end
  if (state.waveActive && state.lastSpawnIndex >= state.spawnQueue.length && state.enemies.every(e => !e.alive)) {
    endWave();
  }

  // Move enemies
  for (const e of state.enemies) {
    if (!e.alive) continue;

    // HP bar always faces camera (billboard) — clean PPT-style readability
    const barGroup = e.mesh.getObjectByName("hpBarGroup");
    if (barGroup) {
      barGroup.quaternion.copy(camera.quaternion);
    }

    // Medic: heal nearby enemies ~15 HP every ~1.5s (radius ~6)
    if (e.heal && Math.random() < 0.015) {
      for (const o of state.enemies) {
        if (o.alive && o !== e && dist2D(e, o) < 6) {
          o.hp = Math.min(o.maxHp, o.hp + 15);
          updateEnemyHpBar(o);
        }
      }
    }

    let spd = e.speed * 0.085;
    if (e.slow > now) spd *= 0.5;

    const target = PATH_POINTS[e.pathIndex + 1];
    if (!target) {
      // Enemy reached the end — remaining HP (or blueprint baseDmg, whichever fits) damages player
      e.alive = false;
      const conf = ENEMIES[e.type];
      // Use remaining HP so wounded enemies hurt less; floor with baseDmg so bombers still sting
      const dmgToPlayer = Math.max(conf.baseDmg || 1, Math.ceil(e.hp));
      state.lives -= dmgToPlayer;
      scene.remove(e.mesh);
      SFX.leak();
      showMsg(`−${dmgToPlayer} HP (${e.type} leaked)`, 1500);

      if (state.lives <= 0) {
        state.lives = 0;
        state.gameOver = true;
        showMsg("Game Over!", 5000);
        showRestartButton(true);
        document.getElementById("startWave").disabled = true;
        document.getElementById("startWave").textContent = "Game Over";
        document.getElementById("skipWave").style.display = "none";
      }
      updateUI();
      continue;
    }

    const dx = target.x - e.x;
    const dz = target.z - e.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.3) {
      e.pathIndex++;
    } else {
      e.x += (dx / d) * spd * dt * 60;
      e.z += (dz / d) * spd * dt * 60;
      e.mesh.position.x = e.x;
      e.mesh.position.z = e.z;
      e.mesh.position.y = e.flying ? 2.0 + Math.sin(now * 0.004) * 0.2 : e.radius + 0.15;

      // Face direction of travel
      e.mesh.rotation.y = Math.atan2(dx, dz);
    }

    // Animate special enemy parts
    if (e.mesh) {
      e.mesh.traverse(c => {
        if (c.name === "rotor") c.rotation.y += (c.userData.spin || 6) * dt;
        if (c.name === "bossRing") c.rotation.z += (c.userData.spin || 1) * dt;
        if (c.name === "fuseSpark") {
          const s = 0.8 + Math.sin(now * 0.02) * 0.4;
          c.scale.setScalar(s);
        }
        if (c.name === "healOrb") {
          c.position.y = e.radius * 1.4 + Math.sin(now * 0.006) * 0.1;
          c.material.emissiveIntensity = 0.5 + Math.sin(now * 0.008) * 0.4;
        }
        if (c.name === "bossCore") {
          c.material.emissiveIntensity = 0.5 + Math.sin(now * 0.005) * 0.4;
        }
        if (c.name === "shieldDisc" && e.shield <= 0) {
          c.visible = false;
        }
      });
    }

    // Overlord: spawn 2 Shield Bearers when below 50% HP (once)
    if (e.type === "Overlord" && !e.spawnedShields && e.hp < e.maxHp * 0.5 && e.hp > 0) {
      e.spawnedShields = true;
      for (let i = 0; i < 2; i++) {
        const s = createEnemy("Shield");
        s.x = e.x + (i === 0 ? -1.5 : 1.5);
        s.z = e.z;
        s.pathIndex = e.pathIndex;
        s.mesh.position.set(s.x, s.y, s.z);
        state.enemies.push(s);
      }
      showMsg("Overlord summoned Shield Bearers!", 2000);
    }
  }

  // Towers attack
  for (const t of state.towers) {
    if (t.type === "Treasury" || t.type === "LePookie") continue;
    const conf = TOWERS[t.type];
    const lvl = conf.levels[t.level];
    if (!lvl.rate) continue;
    const buffs = getLePookieBuffs(t);
    const interval = 1000 / (lvl.rate * buffs.rateMul);
    if (now - t.lastShot >= interval) {
      const target = findTarget(t);
      if (target) shoot(t, target, now);
    }

    // Animate Arcane rings
    if (t.type === "Arcane") {
      t.mesh.children.forEach(c => {
        if (c.userData.isRing) {
          c.rotation.z += c.userData.spinSpeed * dt;
        }
        if (c.userData.isOrb) {
          c.userData.angle += dt * 1.5;
          c.position.x = Math.cos(c.userData.angle) * c.userData.radius;
          c.position.z = Math.sin(c.userData.angle) * c.userData.radius;
        }
      });
    }
  }

  // Animate LePookie aura rings
  for (const t of state.towers) {
    if (t.type !== "LePookie") continue;
    t.mesh.children.forEach(c => {
      if (c.userData.isAuraRing) c.rotation.z += dt * 1.2;
    });
  }

  // Projectiles

  state.projectiles = state.projectiles.filter(p => {
    p.life--;
    p.mesh.position.x += (p.tx - p.mesh.position.x) * 0.35;
    p.mesh.position.y += (p.ty - p.mesh.position.y) * 0.35;
    p.mesh.position.z += (p.tz - p.mesh.position.z) * 0.35;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      return false;
    }
    return true;
  });

  // Particles
  state.particles = state.particles.filter(p => {
    p.life--;
    p.mesh.position.x += p.vx;
    p.mesh.position.y += p.vy;
    p.mesh.position.z += p.vz;
    p.vy -= 0.01;
    p.mesh.material.opacity = p.life / 25;
    p.mesh.material.transparent = true;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      return false;
    }
    return true;
  });

  // Cleanup
  state.enemies = state.enemies.filter(e => e.alive || e.hp > -50);
}

// ===================== INPUT =====================
function getGroundIntersection(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  state.mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  state.mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  state.raycaster.setFromCamera(state.mouse, camera);

  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hit = new THREE.Vector3();
  state.raycaster.ray.intersectPlane(plane, hit);
  return hit;
}

function isOnPath(x, z) {
  for (let i = 0; i < PATH_POINTS.length - 1; i++) {
    const a = PATH_POINTS[i];
    const b = PATH_POINTS[i + 1];
    const d = distToSegment(x, z, a.x, a.z, b.x, b.z);
    if (d < 2.5) return true;
  }
  return false;
}

function distToSegment(px, pz, x1, z1, x2, z2) {
  const A = px - x1, B = pz - z1, C = x2 - x1, D = z2 - z1;
  const dot = A * C + B * D;
  const len = C * C + D * D;
  let t = len ? Math.max(0, Math.min(1, dot / len)) : 0;
  return Math.hypot(px - (x1 + t * C), pz - (z1 + t * D));
}

canvas.addEventListener("mousemove", e => {
  if (!state.placing) return;
  const hit = getGroundIntersection(e.clientX, e.clientY);
  if (state.placementGhost) {
    state.placementGhost.visible = true;
    state.placementGhost.position.set(hit.x, 0, hit.z);
    // Tint red if on path
    const onPath = isOnPath(hit.x, hit.z);
    state.placementGhost.traverse(c => {
      if (c.isMesh && c.material && c.material.color) {
        // keep original-ish
      }
    });
  }
});

canvas.addEventListener("click", e => {
  // Ignore if dragging camera (OrbitControls sets this)
  if (controls.state !== -1 && e.detail === 0) return;

  const hit = getGroundIntersection(e.clientX, e.clientY);

  if (state.placing) {
    const conf = TOWERS[state.placing];
    if (state.money >= conf.baseCost) {
      if (isOnPath(hit.x, hit.z)) return showMsg("Can't place on path");

      // Check overlap with other towers
      for (const t of state.towers) {
        if (dist2D({ x: hit.x, z: hit.z }, t) < 2.2) {
          return showMsg("Too close to another tower");
        }
      }

      state.money -= conf.baseCost;
      state.towers.push(createTower(state.placing, hit.x, hit.z));
      SFX.place();
      state.placing = null;
      clearPlacementGhost();
      document.querySelectorAll(".tower-btn").forEach(b => b.classList.remove("selected"));
      updateUI();
    }
    return;
  }


  // Select tower
  let clicked = null;
  let bestD = 2.0;
  for (const t of state.towers) {
    const d = dist2D({ x: hit.x, z: hit.z }, t);
    if (d < bestD) {
      bestD = d;
      clicked = t;
    }
  }
  state.selected = clicked;
  if (clicked) {
    showSelected(clicked);
  } else {
    document.getElementById("selectedInfo").style.display = "none";
    clearRangeIndicator();
  }
});

document.getElementById("upgradeBtn").onclick = () => {
  const t = state.selected;
  if (!t) return;
  const conf = TOWERS[t.type];
  const next = conf.levels[t.level + 1];
  if (!next || state.money < next.cost) return;
  state.money -= next.cost;
  t.level++;

  // Rebuild mesh with new level
  scene.remove(t.mesh);
  t.mesh = createTowerMesh(t.type, t.level);
  t.mesh.position.set(t.x, 0, t.z);
  scene.add(t.mesh);

  SFX.upgrade();
  showSelected(t);
  updateUI();
  showMsg(`${conf.name} → Level ${t.level + 1}`);
};

document.getElementById("sellBtn").onclick = () => {
  const t = state.selected;
  if (!t) return;
  const conf = TOWERS[t.type];
  let refund = conf.baseCost * 0.6;
  for (let i = 1; i <= t.level; i++) refund += conf.levels[i].cost * 0.6;
  state.money += Math.floor(refund);
  scene.remove(t.mesh);
  state.towers = state.towers.filter(x => x !== t);
  state.selected = null;
  document.getElementById("selectedInfo").style.display = "none";
  clearRangeIndicator();
  SFX.sell();
  updateUI();
};


function restartGame() {
  // Remove all towers, enemies, projectiles, particles from scene
  state.towers.forEach(t => scene.remove(t.mesh));
  state.enemies.forEach(e => { if (e.mesh) scene.remove(e.mesh); });
  state.projectiles.forEach(p => scene.remove(p.mesh));
  state.particles.forEach(p => scene.remove(p.mesh));

  clearPlacementGhost();
  clearRangeIndicator();

  // Reset state
  state.money = 500;
  state.lives = 200;
  state.wave = 0;
  state.placing = null;
  state.selected = null;
  state.towers = [];
  state.enemies = [];
  state.projectiles = [];
  state.particles = [];
  state.waveActive = false;
  state.spawnQueue = [];
  state.lastSpawnIndex = 0;
  state.waveStart = 0;
  state.gameOver = false;

  // Reset UI
  document.getElementById("startWave").textContent = "Start Wave";
  document.getElementById("startWave").disabled = false;
  document.getElementById("skipWave").style.display = "none";
  document.getElementById("selectedInfo").style.display = "none";
  document.querySelectorAll(".tower-btn").forEach(b => b.classList.remove("selected"));
  showRestartButton(false);
  updateUI();
  showMsg("Game restarted! Place towers and Start Wave.", 3000);
}

document.getElementById("startWave").onclick = startWave;
document.getElementById("skipWave").onclick = skipWave;
document.getElementById("restartBtn").onclick = restartGame;

window.addEventListener("keydown", e => {
  const keys = { "1": "Railgunner", "2": "Operator", "3": "Treasury", "4": "Vigilante", "5": "Arcane", "6": "LePookie", "7": "ElBazooka" };


  if (keys[e.key]) {
    const type = keys[e.key];
    if (state.money >= TOWERS[type].baseCost) {
      state.placing = type;
      document.querySelectorAll(".tower-btn").forEach(b => {
        b.classList.toggle("selected", b.dataset.type === type);
      });
      createPlacementGhost(type);
    }
  }
  if (e.key === "Escape") {
    state.placing = null;
    state.selected = null;
    clearPlacementGhost();
    clearRangeIndicator();
    document.querySelectorAll(".tower-btn").forEach(b => b.classList.remove("selected"));
    document.getElementById("selectedInfo").style.display = "none";
  }
});

function onResize() {
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
}
window.addEventListener("resize", onResize);

// ===================== LOOP =====================
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  controls.update();
  updateEnvironment(now, dt);
  update(dt, now);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// Init
buildTowerList();
updateUI();
requestAnimationFrame(loop);
showMsg("Select a tower, click to place on the ground, then Start Wave!", 4000);
</script>
